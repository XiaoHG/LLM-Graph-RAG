[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maohua-top"
version = "0.1.0"
description = "Stage4 scaffold for fluorosis intelligent diagnosis report generation"
requires-python = ">=3.10"
dependencies = ["neo4j>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: tests that require a live Neo4j database"]
